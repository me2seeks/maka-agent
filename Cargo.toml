[workspace]
members = ["crates/tui", "crates/protocol", "crates/transport", "crates/runtime", "crates/presentation"]
default-members = ["crates/tui"]
exclude = ["native/gitoxide-helper", "native/runtime-host-peer", "native/runtime-host-windows-task-launcher", "experiments/windows-sandbox/launcher"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
maka-runtime = { path = "crates/runtime" }
maka-presentation = { path = "crates/presentation" }
maka-protocol = { path = "crates/protocol" }
maka-transport = { path = "crates/transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt", "sync", "time", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", features = ["sink"] }
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
